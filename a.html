<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: #e6f2ff;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}

.weather-card {
  width: 420px;
  padding: 25px;
  border-radius: 12px;
  background: #ffffff;
  box-shadow: 0 6px 15px rgba(0,0,0,0.1);
  text-align: center;
}

.weather-card h2 {
  margin-bottom: 20px;
  color: #333;
}

.search-box {
  display: flex;
  justify-content: center;
  margin-bottom: 15px;
}

.search-box input {
  padding: 10px;
  font-size: 15px;
  border: 1px solid #ccc;
  border-radius: 8px 0 0 8px;
  outline: none;
  width: 65%;
}

.search-box button {
  padding: 10px 15px;
  font-size: 15px;
  border: none;
  border-radius: 0 8px 8px 0;
  background: #0078d7;
  color: white;
  cursor: pointer;
  transition: background 0.3s ease;
}

.search-box button:hover {
  background: #005a9e;
}

#use_current_location {
  margin: 10px 0 20px;
  padding: 10px 20px;
  font-size: 15px;
  border: none;
  border-radius: 8px;
  background: #4CAF50;
  color: white;
  cursor: pointer;
  transition: background 0.3s ease, transform 0.2s ease;
}

#use_current_location:hover {
  background: #45a049;
  transform: scale(1.05);
}

.weather-info {
  font-size: 16px;
  color: #444;
}

.loader {
  font-style: italic;
  color: #888;
}

    </style>
    <title>weather app</title>
</head>
<body>
    <div class="weather-card">
        <h2>Live weather</h2>

        <div class="search-box">
            <input type="text" placeholder="Enter city name" id="city-input">
            <button id="search-button">Search</button>
        </div>
        <button id="use_current_location">Use my current location</button>

        <div id="weather-display" class="weather-info">
            <p class="loader">Loading weather data...</p>
        </div>
    </div>
</body>

<script>
    const API_KEY='e2f4533bb9132244e14272ae67d508a1'
    const searchButton = document.getElementById('search-button');
    const cityInput = document.getElementById('city-input');
    const weatherDisplay = document.getElementById('weather-display');
    const liveWeatherButton = document.getElementById('use_current_location');

   


window.addEventListener('DOMContentLoaded', () => {
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            (position) => {
                const { latitude, longitude } = position.coords;
                fetchWeatherDataByCoordinates(latitude, longitude);
            },
            (error) => {
                weatherDisplay.innerHTML = `<p class="error">Error getting location: ${error.message}</p>`;
            }
        );
    } else {
        weatherDisplay.innerHTML = `<p class="error">Geolocation is not supported by this browser.</p>`;
    }
});
liveWeatherButton.addEventListener('click', () => {
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            (position) => {
                const { latitude, longitude } = position.coords;

                fetchWeatherDataByCoordinates(latitude, longitude);
            },
            (error) => {
                weatherDisplay.innerHTML = `<p class="error">Error getting location: ${error.message}</p>`;
            }
        );
    } else {
        weatherDisplay.innerHTML = `<p class="error">Geolocation is not supported by this browser.</p>`;
    }
});

async function fetchWeatherData(city) {
    try {
        const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${API_KEY}&units=metric`);
        if (!response.ok) {
            throw new Error('City not found');
        }
        const data = await response.json();
        displayWeatherData(data);
    } catch (error) {
        weatherDisplay.innerHTML = `<p class="error">${error.message}</p>`;
    }
}


searchButton.addEventListener('click', () => {
    const city = cityInput.value.trim();
    if (city) {
        fetchWeatherData(city);
        console.log(`Fetching weather data for: ${city}`);
    }
});

async function displayWeatherData(data) {
    const { name, main, weather } = data;
    const weatherHTML = `
        <h3>${name}</h3>
        <p>Temperature: ${main.temp} °C</p>
        <p>Weather: ${weather[0].description}</p>
    `;
    weatherDisplay.innerHTML = weatherHTML;
}
async function fetchWeatherDataByCoordinates(latitude, longitude) {
    try {
        const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${latitude}&lon=${longitude}&appid=${API_KEY}&units=metric`);
        if (!response.ok) {
            throw new Error('Error fetching weather data for the current location');
        }
        console.log(`Fetching weather data for coordinates: Latitude ${latitude}, Longitude ${longitude}`);
        const data = await response.json();
        displayWeatherData(data);
    } catch (error) {
        weatherDisplay.innerHTML = `<p class="error">Error fetching weather data: ${error.message}</p>`;
    }
}





</script>
</html>
